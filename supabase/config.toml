# Local Supabase stack (`supabase start`), used by CI. The hosted project is configured in its dashboard.
project_id = "changewise"

[api]
enabled = true
port = 54321
schemas = ["public"]          # core and app stay out of the REST API

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false               # data comes from scripts/migration, never from a seed file

[realtime]
enabled = false

[studio]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8
signing_keys_path = "./signing_keys.json"

[auth.email]
enabled = true
enable_confirmations = false

[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 300
token_refresh = 300
